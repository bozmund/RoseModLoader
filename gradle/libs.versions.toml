[versions]
asm = "9.10.1"
gson = "2.14.0"
mapping-io = "0.9.1"
tiny-remapper = "0.14.1"
vineflower = "1.12.0"
junit = "6.1.3"
mixin = "0.17.4+mixin.0.8.7"
mixinextras = "0.5.5"
guava = "33.7.2-jre"
# Only for the oracle's Fabric 26.3 reference server (testmods/oracle).
fabric-loader = "0.19.5"
fabric-api-base = "2.0.6+fcdff87f5d"
fabric-lifecycle-events = "4.1.9+ffef5f675d"

[libraries]
asm = { module = "org.ow2.asm:asm", version.ref = "asm" }
asm-tree = { module = "org.ow2.asm:asm-tree", version.ref = "asm" }
asm-commons = { module = "org.ow2.asm:asm-commons", version.ref = "asm" }
asm-util = { module = "org.ow2.asm:asm-util", version.ref = "asm" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
mapping-io = { module = "net.fabricmc:mapping-io", version.ref = "mapping-io" }
tiny-remapper = { module = "net.fabricmc:tiny-remapper", version.ref = "tiny-remapper" }
vineflower = { module = "org.vineflower:vineflower", version.ref = "vineflower" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
asm-analysis = { module = "org.ow2.asm:asm-analysis", version.ref = "asm" }
mixin = { module = "net.fabricmc:sponge-mixin", version.ref = "mixin" }
mixinextras = { module = "io.github.llamalad7:mixinextras-common", version.ref = "mixinextras" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }
fabric-loader = { module = "net.fabricmc:fabric-loader", version.ref = "fabric-loader" }
fabric-api-base = { module = "net.fabricmc.fabric-api:fabric-api-base", version.ref = "fabric-api-base" }
fabric-lifecycle-events = { module = "net.fabricmc.fabric-api:fabric-lifecycle-events-v1", version.ref = "fabric-lifecycle-events" }

[bundles]
asm = ["asm", "asm-tree", "asm-commons", "asm-util", "asm-analysis"]
